<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img {
            width: 100%;
            height: auto;
        }
        #cst {
            width: 100%;
            height: auto;
        }
        .red{
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="imageContainer">
        <p>Image Taken At: <span id="timestamp">N/A</span></p>
        <img id="cst" alt="Loading Live Feed(0/2)">
        <hr>
        <img id="img" src="https://tossd.online/modules/k7/imgs/lg.rotating-squares-preloader-gif.gif" alt="SLOW Camera Feed">
        <hr>
    </div>
    <script>
        (function _(){
            const doc=document;
            const set=(x,y)=>localStorage.setItem(x,y);
            const get=(x)=>localStorage.getItem(x);
            const currURL = (new URL(doc.URL));
            const getURL = currURL.searchParams.get("url");
            const getToken = currURL.searchParams.get("token");
            let refreshToRemoveParams = false;
            const stopRequestingAfterNRequest = 600;
            var requestsSent = 0;
            const refreshPeriodMillisecond = 2000;
            if (getURL) {
                set("REDIS_URL", getURL);
                refreshToRemoveParams = true
            }
            if (getToken) {
                set("REDIS_TOKEN", getToken);
                refreshToRemoveParams = true
            }
            if (refreshToRemoveParams) {
                const d = doc.querySelector("#imageContainer")
                d.parentElement.removeChild(d)
                const link = doc.createElement("a")
                link.innerText="Initialized! Press this link to reload the page"
                link.href =currURL.origin+currURL.pathname
                requestsSent=stopRequestingAfterNRequest;
                doc.body.appendChild(link)
                doc.body.className="red"
            }
            function setUrl() {
                const url = doc.getElementById("urlsetter").value;
                set("REDIS_URL", url);
                alert("URL set successfully!");
            }
            function setToken() {
                const token = doc.getElementById("tokensetter").value;
                set("REDIS_TOKEN", token);
                alert("Token set successfully!");
            }
            async function getImg() {
                try {
                    if (!doc.hidden) {
                        if (requestsSent < stopRequestingAfterNRequest) {
                            const url = get("REDIS_URL")
                            const token = get("REDIS_TOKEN")
                            if (!url || !token) {
                                console.warn("URL or Token not set. Please set them to fetch the camera feed.");
                                throw new Error("URL or Token not set");
                            }
                            const data = await fetch(url + "/pipeline", {
                                "headers": {
                                    "authorization": "Bearer " + token,
                                    "cache-control": "no-cache",
                                    "content-type": "application/json",
                                    "pragma": "no-cache",
                                    "upstash-encoding": "base64",
                                },
                                "body": "[[\"get\",\"cameraFeed1\"]]",
                                "method": "POST",
                                "mode": "cors",
                                "credentials": "include"
                            });
                            requestsSent += 1;
                            let res = await data.json();
                            //console.log(res);
                            const uri = res[0]["result"];
                            const img = doc.getElementById("img");
                            img.src = `data:image/webp;base64,${uri.slice(32)}`;
                            const timestamp = atob(uri.slice(0, 32));
                            const timeDifference=((new Date()).valueOf()-(new Date(timestamp)).valueOf())/1000
                            const timestampElement = doc.getElementById("timestamp");
                            timestampElement.textContent = timestamp;
                            if(timeDifference>300){
                                timestampElement.textContent="WARNING over 5 mins old!"+timestampElement.textContent
                                doc.body.className="red"
                            }
                        }
                        else {
                            const img = doc.getElementById("img");
                            img.src = `https://tossd.online/modules/k7/imgs/lg.rotating-squares-preloader-gif.gif`;
                            const timestampElement = doc.getElementById("timestamp");
                            timestampElement.textContent = "Camera Timed Out. Please Refresh the page";
                        }
                    }
                } catch (e) {
                    console.error("Error fetching image:", e);
                }
                if (requestsSent < stopRequestingAfterNRequest) {
                    setTimeout(getImg, refreshPeriodMillisecond);
                }
            }
            async function getTunnel() {
                const url = get("REDIS_URL")
                const token = get("REDIS_TOKEN")
                if (!url || !token) {
                    console.warn("URL or Token not set. Please set them to fetch the camera feed.");
                    throw new Error("URL or Token not set");
                }
                const data = await fetch(url + "/pipeline", {
                    "headers": {
                        "authorization": "Bearer " + token,
                        "cache-control": "no-cache",
                        "content-type": "application/txt",
                        "pragma": "no-cache",
                    },
                    "body": "[[\"get\",\"tunnel\"]]",
                    "method": "POST",
                    "mode": "cors",
                    "credentials": "include"
                });
                requestsSent += 1;
                const imgElement = document.getElementById('cst');
                const wsUrl = JSON.parse(await data.text())[0]['result'];
                const alt=(x)=>imgElement.setAttribute("alt",x);
                alt("Loading Live Feed(1/2)");
                const ws= new WebSocket(wsUrl);
                ws.binaryType='blob';
                ws.onmessage = (event) => {
                    if(event.data instanceof Blob){
                        const imageUrl = URL.createObjectURL(event.data);
                        if (imgElement) {
                            // Revoke the old URL memory reference if one already existed to avoid leaks
                            if (imgElement.src && imgElement.src.startsWith('blob:')) {
                                URL.revokeObjectURL(imgElement.src);
                            }
                            
                            // Assign the fresh memory pointer to the image tag source
                            imgElement.src = imageUrl;
                        }
                    }
                };
                ws.onopen=()=>alt("Loading Live Feed(2/2)");
                ws.onclose=()=>alt("Live Feed Stopped");
            }
            getImg();
            getTunnel();
        })()
    </script>
</body>

</html>
